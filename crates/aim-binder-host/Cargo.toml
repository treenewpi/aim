[package]
license.workspace = true
name = "aim-binder-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "Hosts the binder driver core for guest processes in one daemon, over Mach messages (ADR 0012 decision 7)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aim-binderd"
path = "src/bin/aim-binderd.rs"

[[bin]]
name = "aim-binder-proc"
path = "src/bin/aim-binder-proc.rs"

[dependencies]
aim-bionic-smoke = { path = "../aim-bionic-smoke" }
aim-storage = { path = "../aim-storage" }
aim-binder-driver = { path = "../aim-binder-driver" }
aim-elf-smoke = { path = "../aim-elf-smoke" }
libc.workspace = true
